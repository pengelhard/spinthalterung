<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spinthalterung – Bilder</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; background: #111; color: #eee; }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    p { color: #aaa; margin-top: 0; }
    figure { margin: 1.5rem 0; }
    figcaption { margin: 0.4rem 0 0.8rem; color: #bbb; font-size: 0.95rem; }
    img { max-width: 100%; height: auto; border-radius: 8px; background: #222; display: block; }
    a { color: #8cf; }
  </style>
</head>
<body>
  <h1>Spinthalterung – Bilder</h1>
  <p>Onshape-Entwurf der Spinttür und der 3D-gedruckten Halterung. Ohne Login.</p>

  <figure>
    <figcaption>Spinttür vorn</figcaption>
    <img src="images/spint_vorn.png" alt="Spinttür vorn">
  </figure>
  <figure>
    <figcaption>Spinttür isometrisch</figcaption>
    <img src="images/spint_iso.png" alt="Spinttür isometrisch">
  </figure>
  <figure>
    <figcaption>Halter isometrisch</figcaption>
    <img src="images/halter_iso.png" alt="Halter isometrisch">
  </figure>
  <figure>
    <figcaption>Halter isometrisch hinten</figcaption>
    <img src="images/halter_iso_hinten.png" alt="Halter isometrisch hinten">
  </figure>
  <figure>
    <figcaption>Assembly isometrisch</figcaption>
    <img src="images/halter_asm_iso.png" alt="Assembly isometrisch">
  </figure>
  <figure>
    <figcaption>Assembly außen</figcaption>
    <img src="images/halter_asm_aussen.png" alt="Assembly außen">
  </figure>
  <figure>
    <figcaption>Assembly Seite</figcaption>
    <img src="images/halter_asm_seite.png" alt="Assembly Seite">
  </figure>
  <figure>
    <figcaption>Assembly vorn innen</figcaption>
    <img src="images/halter_asm_vorn_innen.png" alt="Assembly vorn innen">
  </figure>
  <figure>
    <figcaption>Detail Hakenzunge / Nut</figcaption>
    <img src="images/detail_hakenzunge_nut.png" alt="Detail Hakenzunge Nut">
  </figure>
  <figure>
    <figcaption>Detail Riegel außen</figcaption>
    <img src="images/detail_riegel_aussen.png" alt="Detail Riegel außen">
  </figure>
</body>
</html>
